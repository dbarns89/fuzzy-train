name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/VcxDiag.Core.Tests -c Release
      - name: Publish x86 (matches 32-bit J2534 drivers)
        run: dotnet publish src/VcxDiag.App -c Release -r win-x86 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o artifacts/x86
      - name: Publish x64
        run: dotnet publish src/VcxDiag.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o artifacts/x64
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\VcxDiag.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VcxDiag-windows
          path: |
            windows/artifacts/x86/VcxDiag.exe
            windows/installer/Output/VcxDiag-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VcxDiag-windows-x64
          path: windows/artifacts/x64/VcxDiag.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item artifacts/x86/VcxDiag.exe VcxDiag-x86.exe
          Copy-Item artifacts/x64/VcxDiag.exe VcxDiag-x64.exe
          gh release create $env:GITHUB_REF_NAME VcxDiag-x86.exe VcxDiag-x64.exe installer/Output/VcxDiag-Setup.exe --title "VCX Diag $env:GITHUB_REF_NAME" --generate-notes
